---
services:
  database:
    image: postgres:16
    container_name: mywebapp_database
    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: mywebapp
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mywebapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mywebapp -d mywebapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/mywebapp/Dockerfile
    container_name: mywebapp_web
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mywebapp_network
    command: >
      sh -c "python migrate.py &&
             gunicorn --workers 2 --bind 0.0.0.0:8000 app:app"

  nginx:
    image: nginx:1.27
    container_name: mywebapp_nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker-mywebapp.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mywebapp_network

volumes:
  postgres_data:

networks:
  mywebapp_network:
    driver: bridge
