---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - python3
      - python3-pip
      - python3-venv
      - acl
    state: present

- name: Ensure teacher user exists
  ansible.builtin.user:
    name: teacher
    shell: /bin/bash
    groups:
      - sudo
    append: true
    password: "{{ teacher_password | password_hash('sha512') }}"

- name: Create gradebook file
  ansible.builtin.copy:
    dest: /home/student/gradebook
    content: "{{ student_number }}\n"
    owner: root
    group: root
    mode: "0644"
  ignore_errors: true
