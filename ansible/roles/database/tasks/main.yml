---
- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Configure PostgreSQL listen address
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: /etc/postgresql/16/main/conf.d/mywebapp.conf
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Allow worker node to connect to PostgreSQL
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    line: "host {{ db_name }} {{ db_user }} {{ hostvars[groups['workers'][0]]['ansible_host'] }}/32 md5"
    state: present
  notify: Restart postgresql

- name: Ensure PostgreSQL service is started
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    state: present
  become_user: postgres

- name: Create application database user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    db: "{{ db_name }}"
    priv: "ALL"
    state: present
  become_user: postgres

- name: Restrict PostgreSQL port with ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow PostgreSQL only from worker
  community.general.ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
    from_ip: "{{ hostvars[groups['workers'][0]]['ansible_host'] }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
