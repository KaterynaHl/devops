---
name: CI/CD

"on":
  push:
    branches:
      - lab3
    tags:
      - "v*"
  pull_request:
    branches:
      - lab3

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/mywebapp

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app app.py migrate.py tests

      - name: Run yamllint
        run: |
          yamllint .github/workflows docker-compose.yml \
            docker-compose.prod.yml

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck --exclude=SC1091,SC2029 scripts/*.sh

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/mywebapp/Dockerfile

  test:
    name: Automated tests
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata for branch
        if: startsWith(github.ref, 'refs/heads/')
        id: meta_branch
        run: |
          echo "tags=${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata for tag
        if: startsWith(github.ref, 'refs/tags/')
        id: meta_tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tags=${IMAGE_NAME}:stable,${IMAGE_NAME}:${TAG_NAME}" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push image from branch
        if: startsWith(github.ref, 'refs/heads/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mywebapp/Dockerfile
          push: true
          tags: ${{ steps.meta_branch.outputs.tags }}

      - name: Build and push image from tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mywebapp/Dockerfile
          push: true
          tags: ${{ steps.meta_tag.outputs.tags }}

  deploy:
    name: Deploy to target node
    runs-on: self-hosted
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TARGET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.TARGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          APP_IMAGE: ghcr.io/${{ github.repository }}/mywebapp:stable
        run: bash scripts/deploy.sh

  verify:
    name: Verify deployment
    runs-on: self-hosted
    needs:
      - deploy
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployed service
        env:
          TARGET_URL: http://${{ secrets.TARGET_HOST }}
        run: bash scripts/verify.sh
